[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malign"
dynamic = ["version"]
description = "Library for multiple asymmetric alignments on different alphabets"
readme = "README.md"
license = "MIT"
keywords = ["alignment", "sequence alignment", "multiple alphabet", "linguistics", "asymmetric"]
authors = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "tabulate>=0.8.0",
    "PyYAML>=5.4.0",
]

[project.optional-dependencies]
# Development dependencies (required for Phase 1+)
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "hypothesis>=6.0.0",

    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.5.0",

    # Build and release
    "build>=0.10.0",
    "twine>=4.0.0",

    # Documentation (nhandu for tutorials)
    "nhandu>=0.1.0",
]

# Phonological feature distances
features = [
    "distfeat>=0.5.0",
]

# LingPy comparison benchmark
lingpy = [
    "lingpy>=2.6.0",
]

# All optional dependencies
all = [
    "malign[dev,features,lingpy]",
]

[project.urls]
Homepage = "https://github.com/tresoldi/malign"
Documentation = "https://github.com/tresoldi/malign/blob/main/docs/USER_GUIDE.md"
Repository = "https://github.com/tresoldi/malign.git"
Issues = "https://github.com/tresoldi/malign/issues"
Changelog = "https://github.com/tresoldi/malign/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "malign.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["malign*"]

[tool.setuptools.package-data]
malign = ["py.typed"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "__pycache__", ".git", ".mypy_cache", ".pytest_cache",
    ".ruff_cache", ".venv", "venv", "build", "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
    "D",     # pydocstyle
]

ignore = [
    "E501",   # Line too long (ruff format handles this)
    "B008",   # Do not perform function calls in argument defaults
    "RET504", # Unnecessary variable assignment before return
    "ARG002", # Unused method argument (common in abstract methods)
    "D202",   # No blank lines allowed after function docstring
    "D200",   # One-line docstring should fit on one line
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", "ARG002",  # Unused arguments in tests
    "S101",              # Use of assert detected
    "D100", "D103", "D104",  # Missing docstrings in tests
    "T201",              # Allow print statements
    "B905",              # zip() without strict= (test data)
    "PT007", "PT017",    # Parametrize style, assertion on exception
    "SIM222",            # or True patterns
    "F841",              # Unused variables (test scaffolding)
]
"malign/learning.py" = [
    "T201",              # Allow print statements (verbose output)
]
"scripts/*.py" = [
    "D100", "D103",      # Missing docstrings
    "T201",              # Allow print statements
    "B007",              # Unused loop variables
    "SIM108",            # Ternary suggestions
    "C401",              # Generator vs comprehension
]
"docs/tutorial_*.py" = [
    "D100", "D103",      # Missing docstrings (self-documenting)
    "E402",              # Module import not at top (pedagogical)
    "T201",              # Allow print statements
    "RUF001",            # Ambiguous unicode (intentional for demos)
]
"examples/*.py" = [
    "D100", "D103",      # Missing docstrings
    "T201",              # Allow print statements
    "C416",              # List comprehension style
    "B007",              # Unused loop variables
    "RUF001",            # Ambiguous unicode (intentional for demos)
]
"benchmarks/*.py" = [
    "D100", "D103",      # Missing docstrings
    "E402",              # Module import not at top (logging setup)
    "T201",              # Allow print statements
    "C416",              # List comprehension style
    "B007",              # Unused loop variables
    "RUF001",            # Ambiguous unicode (intentional for demos)
    "ARG001",            # Unused function arguments (signal handlers)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# MyPy configuration (relaxed initially, per Q6 answer)
[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Relaxed
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed - will tighten in Phase 1.7
disallow_incomplete_defs = false  # Relaxed
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Relaxed initially
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "tabulate.*", "pytest.*", "hypothesis.*", "yaml.*", "distfeat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lingpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "malign.anw",
    "malign.dumb",
    "malign.learning",
    "malign.malign",
    "malign.ndim_yenksp",
    "malign.progressive",
    "malign.yenksp",
]
ignore_errors = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m", "not slow",
    "--timeout=120",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "regression: marks tests that validate against gold-standard data",
    "property: marks property-based tests using Hypothesis",
    "benchmark: marks performance benchmark tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["malign"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
precision = 2
# Start with current coverage, will increase to 90 in Phase 3
# fail_under = 90  # Commented out for now

[tool.coverage.html]
directory = "tests/htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
